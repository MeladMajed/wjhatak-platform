<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة منتج جديد - منصة وجهتك</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; direction: rtl; text-align: right; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; }
        .form-container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #1e293b; margin-bottom: 20px; font-size: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #334155; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: white; }
        textarea { resize: vertical; height: 70px; }
        .price-currency-wrapper { display: flex; gap: 10px; }
        .submit-btn { width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.2s; margin-top: 10px; }
        .submit-btn:hover { background: #15803d; }
        .back-link { display: inline-block; margin-top: 15px; color: #0284c7; text-decoration: none; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>🔒 التحقق من الحساب وإضافة السلعة</h2>
       
        <!-- حماية الحساب: اسم المستخدم وكلمة المرور -->
        <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px;">
            <div class="form-group" style="margin-bottom: 10px;">
                <label>اسم المستخدم أو رقم الهاتف المسجل:</label>
                <input type="text" id="usernameInput" placeholder="أدخل اسم المستخدم أو الهاتف...">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>كلمة المرور:</label>
                <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور...">
            </div>
        </div>

        <!-- اسم السلعة (العنوان) -->
        <div class="form-group">
            <label>اسم السلعة (العنوان):</label>
            <input type="text" id="productTitle" placeholder="مثال: جوال سامسونج...">
        </div>

        <div class="form-group">
            <label>تصنيف السلعة (القسم):</label>
            <select id="productCategory">
                <option value="هواتف">هواتف وإلكترونيات</option>
                <option value="رجالي">👔 ملابس رجالي</option>
                <option value="نسائي">👗 ملابس نسائي</option>
                <option value="شبابي">👕 ملابس شبابي</option>
                <option value="ولادي">👶 ملابس ولادي</option>
                <option value="أحذية">👟 أحذية</option>
                <option value="منزلية">🔌 أدوات منزلية وكهربائية</option>
                <option value="فضيات">💍 فضيات</option>
                <option value="مكتبيات">📚 مكتبيات</option>
            </select>
        </div>

        <!-- الدولة -->
        <div class="form-group">
            <label>الدولة:</label>
            <select id="productCountry">
                <option value="اليمن">اليمن</option>
                <option value="المملكة العربية السعودية">المملكة العربية السعودية</option>
                <option value="الإمارات العربية المتحدة">الإمارات العربية المتحدة</option>
                <option value="جمهورية مصر العربية">جمهورية مصر العربية</option>
                <option value="الكويت">الكويت</option>
                <option value="قطر">قطر</option>
                <option value="سلطنة عمان">سلطنة عمان</option>
                <option value="البحرين">البحرين</option>
                <option value="الأردن">الأردن</option>
                <option value="العراق">العراق</option>
                <option value="فلسطين">فلسطين</option>
                <option value="سوريا">سوريا</option>
                <option value="لبنان">لبنان</option>
                <option value="السودان">السودان</option>
                <option value="المغرب">المغرب</option>
                <option value="الجزائر">الجزائر</option>
                <option value="تونس">تونس</option>
                <option value="ليبيا">ليبيا</option>
            </select>
        </div>

        <!-- المحافظة أو المنطقة -->
        <div class="form-group">
            <label>المحافظة / المنطقة:</label>
            <input type="text" id="productRegion" placeholder="مثال: صنعاء، عدن، الرياض، القاهرة...">
        </div>

        <!-- حالة السلعة (جديد أو مستعمل) -->
        <div class="form-group">
            <label>حالة السلعة:</label>
            <select id="productCondition">
                <option value="جديد">✨ جديد (لم يُستخدم)</option>
                <option value="مستعمل">📦 مستعمل (بحالة ممتازة)</option>
            </select>
        </div>

        <div class="form-group">
            <label>صورة السلعة:</label>
            <input type="file" id="productImageFile" accept="image/*" style="padding: 8px;">
        </div>

        <!-- مميزات السلعة -->
        <div class="form-group">
            <label>مميزات السلعة:</label>
            <textarea id="productFeatures" placeholder="اكتب مميزات السلعة..."></textarea>
        </div>

        <!-- عيوب السلعة -->
        <div class="form-group">
            <label>عيوب السلعة (إن وجدت):</label>
            <textarea id="productFlaws" placeholder="اكتب العيوب إن وجدت أو اتركها فارغة..."></textarea>
        </div>

        <!-- السعر والعملة -->
        <div class="form-group">
            <label>السعر والعملة:</label>
            <div class="price-currency-wrapper">
                <input type="text" id="productPriceNum" placeholder="أدخل السعر أرقام فقط" style="flex: 2;">
                <select id="productCurrency" style="flex: 1;">
                    <option value="ر.ي">ريال يمني (ر.ي)</option>
                    <option value="$">دولار أمريكي ($)</option>
                    <option value="ر.س">ريال سعودي (ر.س)</option>
                    <option value="ج.م">جنيه مصري (ج.م)</option>
                </select>
            </div>
        </div>

        <button class="submit-btn" onclick="saveNewProduct()">التحقق ونشر السلعة</button>
        <br>
        <a href="index.html" class="back-link">← العودة إلى الصفحة الرئيسية</a>
    </div>

    <script>
        function saveNewProduct() {
            var username = document.getElementById('usernameInput').value.trim();
            var password = document.getElementById('passwordInput').value.trim();

            if (!username || !password) {
                alert('عذراً، يجب إدخال اسم المستخدم وكلمة المرور للسماح لك بنشر السلعة!');
                return;
            }

            // التحقق من الحسابات المسجلة في النظام (platformVendors)
            var vendors = JSON.parse(localStorage.getItem('platformVendors')) || [];
            var validVendor = vendors.find(function(v) {
                return (v.phone === username || v.name === username) && v.pass === password;
            });

            // استثناء تجريبي للحساب الافتراضي أو المعتمد
            if (!validVendor && !(username === 'majd' && password === '123456')) {
                alert('اسم المستخدم أو كلمة المرور غير صحيحة أو الحساب غير مسجل!');
                return;
            }

            var vendorName = validVendor ? validVendor.name : username;
            var title = document.getElementById('productTitle').value.trim();
            var category = document.getElementById('productCategory').value;
            var country = document.getElementById('productCountry').value;
            var region = document.getElementById('productRegion').value.trim();
            var condition = document.getElementById('productCondition').value;
            var features = document.getElementById('productFeatures').value.trim();
            var flaws = document.getElementById('productFlaws').value.trim();
           
            var priceNum = document.getElementById('productPriceNum').value.trim();
            var currency = document.getElementById('productCurrency').value;
            var fullPrice = priceNum + ' ' + currency;

            var fileInput = document.getElementById('productImageFile');

            if (!title || !priceNum) {
                alert('الرجاء إدخال اسم السلعة والسعر على الأقل!');
                return;
            }

            var reader = new FileReader();
            if (fileInput.files && fileInput.files[0]) {
                reader.onload = function(e) {
                    storeProduct(vendorName, title, category, country, region, condition, features, flaws, fullPrice, e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                storeProduct(vendorName, title, category, country, region, condition, features, flaws, fullPrice, '');
            }
        }

        function storeProduct(username, title, category, country, region, condition, features, flaws, price, image) {
            var products = JSON.parse(localStorage.getItem('platformProducts')) || [];
           
            var newProduct = {
                sellerName: username,
                title: title,
                category: category,
                country: country,
                region: region,
                condition: condition,
                features: features,
                flaws: flaws,
                price: price,
                image: image // متوافق تماماً للعرض في الصفحة الرئيسية
            };

            products.push(newProduct);
            localStorage.setItem('platformProducts', JSON.stringify(products));

            alert('تم التحقق من الحساب ونشر السلعة بنجاح!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
